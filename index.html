<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>10godr Working On It</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Saira+Stencil+One&display=swap">

  <!-- Estilos -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/letrero.css">
  <link rel="stylesheet" href="assets/css/obrero.css">
  <link rel="stylesheet" href="assets/css/espera.css">
  <link rel="stylesheet" href="assets/css/animaciones.css">

  <!-- Scripts (defer: corren cuando el HTML ya está cargado) -->
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/tema.js" defer></script>
  <script src="assets/js/letrero.js" defer></script>
  <script src="assets/js/espera.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <main class="escena">

    <!-- Letrero colgante -->
    <div class="grua">
      <div class="cables">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="50" y1="0" x2="6" y2="100"></line>
          <line x1="50" y1="0" x2="94" y2="100"></line>
        </svg>
        <span class="gancho"></span>
      </div>
      <div class="letrero">
        <div class="franja"></div>
        <div class="letrero-cuerpo">
          <h1 class="nombre" id="nombre"></h1>
          <p class="lema" id="lema"></p>
        </div>
        <div class="franja"></div>
        <i class="tornillo a"></i><i class="tornillo b"></i><i class="tornillo c"></i><i class="tornillo d"></i>
      </div>
    </div>

    <!-- Obrero -->
    <div class="obrero">
      <img id="imagen" alt="Muñeco con casco trabajando en una laptop junto a un cono">
    </div>

    <!-- Círculo de espera -->
    <div class="espera" role="status">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="pista" cx="50" cy="50" r="44"></circle>
        <circle class="arco" cx="50" cy="50" r="44"></circle>
        <circle class="arco2" cx="50" cy="50" r="44"></circle>
      </svg>
      <span id="palabra"></span>
    </div>

  </main>
</body>
</html>
